name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * *" # Hver dag kl. 06 UTC
  workflow_dispatch: # Kan også køres manuelt

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: github-pages-deployment

    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.VITE_SUPABASE_APIKEY }}
      PING_TABLE: events

    steps:
      - name: Ping Supabase
        run: |
          curl --fail-with-body -sS -w "\nHTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/$PING_TABLE?select=*&limit=1" \
            -H "apikey: $SUPABASE_KEY"
